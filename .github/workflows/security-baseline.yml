name: Security Baseline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6
      - name: Semgrep source/runtime security scan
        run: semgrep scan --config auto --error --exclude '.github/workflows/**'
      - name: Workflow supply-chain debt receipt
        run: echo "Mutable action tags are tracked separately in GitHub issue #2 until every action is pinned to an immutable reviewed SHA."
